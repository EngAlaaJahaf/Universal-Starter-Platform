<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.5" />
  <!-- Futuristic T Emblem -->
  <g filter="url(#glow)">
    <!-- Top Bar -->
    <rect x="146" y="140" width="220" height="50" rx="25" fill="#00d2ff" />
    <!-- Vertical Stem -->
    <rect x="226" y="170" width="60" height="190" rx="30" fill="#3b82f6" />
    <!-- Wave Arc -->
    <path d="M 330 200 A 110 110 0 0 1 380 280" fill="none" stroke="#8b5cf6" stroke-width="12" stroke-linecap="round" />
    <!-- AI Pulse Spark Node -->
    <circle cx="370" cy="165" r="18" fill="#00e5ff" opacity="0.4" />
    <circle cx="370" cy="165" r="10" fill="#ffffff" />
    <!-- Signal Dots -->
    <circle cx="210" cy="400" r="10" fill="#00d2ff" opacity="0.6" />
    <circle cx="256" cy="400" r="12" fill="#00d2ff" />
    <circle cx="302" cy="400" r="10" fill="#00d2ff" opacity="0.6" />
  </g>
</svg>
